name: diag-cf-files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List CurseForge files for project
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CF_ID: ${{ vars.CURSEFORGE_ID }}
        run: |
          set -e
          CODE=$(curl -s -w "%{http_code}" -o cf-raw.json \
            -H "x-api-key: $CF_TOKEN" -H "Accept: application/json" \
            "https://api.curseforge.com/v1/mods/$CF_ID/files?pageSize=40")
          echo "HTTP $CODE, bytes: $(wc -c < cf-raw.json)"
          head -c 400 cf-raw.json; echo
          python3 - <<'PY'
          import json
          try:
              data = json.load(open('cf-raw.json'))
          except Exception as e:
              print("parse failed:", e); raise SystemExit(0)
          for f in data.get('data', []):
              print(f["displayName"], "|", f["name"], "| type", f["releaseType"], "|",
                    [l["name"] for l in f.get("loaders", [])])
          PY
